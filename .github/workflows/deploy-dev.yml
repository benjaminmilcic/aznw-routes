name: Deploy Frontend (benjamin-milcic.dev)

on:
  push:
    branches: [new]
    # The AI chat reads its knowledge base straight from GitHub (python-aznw-api checks for changes every 15
    # minutes), so a push that only changes these files needs no deploy. A push with other files still deploys.
    paths-ignore:
      - 'ai-chat-knowledge-base/**'
  # Manual start via Actions -> "Run workflow". There the test run can be
  # skipped with a checkbox when it has to be quick.
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip the E2E tests and deploy right away'
        type: boolean
        default: false

# One deploy at a time: a new push waits for the running deploy instead of
# racing it (an older run finishing last would otherwise put the old state live).
# Waiting runs are superseded by newer ones, so only the latest commit is deployed.
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

env:
  DEPLOY_HOST: 212.227.31.144
  DEPLOY_USER: deploy
  TARGET_DIR: /var/www/benjamin-milcic.dev/frontend/

jobs:
  # Tests and build run in parallel; only the delivery waits for both.
  # A red test still prevents publishing.
  #
  # Skipping works in two ways:
  #   1. Manual start with the "skip_tests" checkbox set.
  #   2. "[skip tests]" or "[skip e2e]" anywhere in the commit message.
  # In both cases this job does not even start and the deploy
  # starts right away.
  e2e:
    name: Cypress
    runs-on: ubuntu-latest
    if: >-
      !(
        (github.event_name == 'workflow_dispatch' && inputs.skip_tests) ||
        contains(github.event.head_commit.message, '[skip tests]') ||
        contains(github.event.head_commit.message, '[skip e2e]')
      )
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # environment.ts reads the keys via process.env, which the
      # DefinePlugin fills in from .env. Without the file the expressions would stay
      # undefined and the browser would report "process is not defined".
      # The values are meaningless: all external services are cut off in the
      # tests.
      - name: Create placeholder keys
        run: |
          cat > .env << 'EOF'
          STRIPE_PUBLISHABLE_KEY=pk_test_placeholder
          GEOAPIFY_API_KEY=test-placeholder
          MAPTILER_API_KEY=test-placeholder
          ELEVENLABS_API_KEY=test-placeholder
          TMDB_API_KEY=test-placeholder
          GOOGLE_MAPS_API_KEY=test-placeholder
          TINYMCE_API_KEY=test-placeholder
          EOF

      - name: Dependencies
        run: npm install --force

      - name: Cypress cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Make sure the Cypress binary is installed
        run: npx cypress install

      # Starts the dev server, waits for port 4200 and then runs all
      # specs. The server is stopped automatically at the end.
      - name: E2E tests
        run: npm run e2e

      - name: Keep screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7

  # `always()` is needed so that the job also runs when `e2e`
  # was skipped - without it GitHub would skip it as well.
  # A really red test still blocks.
  # Runs in parallel to `e2e` - the build does not depend on the test result.
  # A deploy therefore only takes as long as the longer of the two
  # jobs instead of their sum.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `cache: npm` keeps ~/.npm between runs, keyed by
      # package-lock.json. Saves downloading the dependencies as long as
      # the lockfile does not change.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Create the environment for the new server
        run: |
          cat > src/environments/environment.prod.ts << 'EOF'
          const api = 'https://api.benjamin-milcic.dev';

          export const environment = {
            stripePublishableKey: '${{ secrets.STRIPE_PUBLISHABLE_KEY }}',
            stripe: {
              createApi: `${api}/stripe`,
              returnUrl: `https://benjamin-milcic.dev`,
            },
            guestbook: {
              getAllPostsApi: `${api}/guestbook`,
              addPostApi: `${api}/guestbook`,
              filesUrl: `${api}/files`,
            },
            contact: {
              form2mailApi: `${api}/form2email`,
            },
            auth: {
              getJokesFile: `${api}/auth/jokes`,
              login: `${api}/auth/login`,
              signup: `${api}/auth/signup`,
              tts: `${api}/auth/tts`,
            },
            chat: {
              streamApi: `${api}/chat/stream`,
              sessionApi: `${api}/chat`,
              transcribeApi: `${api}/chat/transcribe`,
              speechApi: `${api}/chat/speech`,
            },
            availability: {
              availabilityApi: `${api}/availability`,
            },
            moorhuhn: {
              moorhuhnApi: `${api}/moorhuhn`,
            },
            triviaQuiz: {
              randomQuestionsApi: `${api}/trivia/questions/random`,
              questionsByNumbersApi: `${api}/trivia/questions/by-numbers`,
            },
            error: {
              errorMessageApi: `${api}/error2email`,
            },
            yahtzeeGame: {
              webSocketsUrl: `${api}/yahtzee-game`,
            },
            geoLocation: {
              reverseGeoCodeApi: `${api}/geolocation/reverse-geocode`,
              geoCodeApi: `${api}/geolocation/geocode`,
              citiesApi: `${api}/geolocation/cities`,
            },
            googleLogin: {
              loginApi: `${api}/auth/google`,
            },
            recipes: {
              recipesApi: `${api}/recipes`,
              filesUrl: `${api}/files`,
              translationEmail: 'benjamin.milcic@gmail.com',
            },
            geoapify: { apiKey: '${{ secrets.GEOAPIFY_API_KEY }}' },
            maptiler: { apiKey: '${{ secrets.MAPTILER_API_KEY }}' },
            telegram: {
              apiUrl: `${api}/telegram`,
              webSocketsUrl: `${api}/telegramws`,
            },
            tmdb: { apiKey: '${{ secrets.TMDB_API_KEY }}' },
            googleMaps: { apiKey: '${{ secrets.GOOGLE_MAPS_API_KEY }}' },
            tinymce: { apiKey: '${{ secrets.TINYMCE_API_KEY }}' },
            imagegen: { apiUrl: `${api}/imagegen` },
            search: { embedUrl: `${api}/imagegen/embed` },
            production: true,
            version: new Date().getTime(),
          };
          EOF

      - name: Build
        run: |
          npm install --force
          npm run build

      - name: Find the build output
        id: dist
        run: |
          if   [ -f dist/aznw-routes/browser/index.html ]; then D=dist/aznw-routes/browser
          elif [ -f dist/aznw-routes/index.html ];        then D=dist/aznw-routes
          else D=$(dirname "$(find dist -maxdepth 3 -name index.html | head -1)"); fi
          echo "Found: $D"
          ls -la "$D" | head
          echo "dir=$D" >> "$GITHUB_OUTPUT"

      # Puts the commit id into the build output, so that it can later be checked
      # unambiguously which state is live - regardless of whether
      # bundle names have changed. Must run before the rsync.
      - name: Write the build id
        run: |
          printf '{"sha":"%s","run":"%s","built":"%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > "${{ steps.dist.outputs.dir }}/build-info.json"
          cat "${{ steps.dist.outputs.dir }}/build-info.json"

      # The deploy job runs on its own runner and cannot see the dist/
      # of the build. The artifact is the bridge in between.
      - name: Store the build output as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ${{ steps.dist.outputs.dir }}/
          retention-days: 3

  # Delivers as soon as the build is done and the tests are not red.
  # `always()` removes the coupling to skipped tests; the check of
  # `needs.build.result` prevents deploying without a finished build.
  # This job needs neither checkout nor Node - it only uploads the artifact
  # and checks the result afterwards.
  deploy:
    needs: [e2e, build]
    if: >-
      always()
      && needs.build.result == 'success'
      && needs.e2e.result != 'failure'
      && needs.e2e.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Get the build output
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist-out

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Upload
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/id_ed25519" \
            dist-out/ \
            "$DEPLOY_USER@$DEPLOY_HOST:$TARGET_DIR"

      # Cloudflare caches /assets/ practically forever (s-maxage in the vhost).
      # Without this step the edge keeps delivering the old file after a deploy
      # as soon as an image was replaced under the same name -
      # Angular only hashes bundles, not the content of src/assets/.
      - name: Purge the Cloudflare cache
        run: |
          resp=$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "$resp"
          echo "$resp" | grep -q '"success":true' \
            || { echo "Purge failed - the edge may still deliver old files"; exit 1; }      

      # Checks that exactly THIS commit is live. Reads the id instead of
      # inferring it from bundle names - that way it also catches changes that
      # do not move a bundle hash (lazy chunks, images, i18n files).
      - name: Verify
        run: |
          echo "Expecting sha=$GITHUB_SHA"
          for i in $(seq 1 10); do
            live=$(curl -sS --max-time 15 "https://benjamin-milcic.dev/build-info.json?r=$GITHUB_RUN_ID" || true)
            echo "Attempt $i: $live"
            if printf '%s' "$live" | grep -q "\"sha\":\"$GITHUB_SHA\""; then
              # Right after the Cloudflare purge a request can take longer than 15 s: --retry tries a timeout
              # again, "|| true" keeps bash -e from ending the step on it. A wrong status (e.g. 404) is not
              # retried and still fails below; no answer at all shows up as HTTP 000.
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 --retry 3 --retry-delay 5 https://benjamin-milcic.dev/ || true)
              [ "$code" = "200" ] || { echo "Home page answers with HTTP $code"; exit 1; }
              # Since the switch to path routing every subpage depends on the
              # SPA fallback of Apache. If it fails, only the home page is
              # reachable - the check above would not notice that.
              deep=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 --retry 3 --retry-delay 5 https://benjamin-milcic.dev/gimmicks/map || true)
              [ "$deep" = "200" ] || { echo "Deep link /gimmicks/map answers with HTTP $deep - SPA fallback missing (check FallbackResource/AllowOverride in Apache)"; exit 1; }
              echo "Deploy verified - commit $GITHUB_SHA is live, home page and deep link HTTP 200."
              exit 0
            fi
            sleep 6
          done
          echo "ERROR: build-info.json still does not report $GITHUB_SHA after 10 attempts"
          exit 1