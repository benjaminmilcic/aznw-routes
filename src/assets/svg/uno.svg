<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="UNO">
  <!-- Tisch -->
  <rect width="64" height="64" rx="12" fill="#9f1239" />

  <!-- Aufgefächerte Karten -->
  <g stroke="#ffffff" stroke-width="2.5">
    <rect x="10" y="20" width="20" height="28" rx="3" fill="#3b82f6" transform="rotate(-18 20 34)" />
    <rect x="16" y="18" width="20" height="28" rx="3" fill="#22c55e" transform="rotate(-6 26 32)" />
    <rect x="24" y="17" width="20" height="28" rx="3" fill="#facc15" transform="rotate(6 34 31)" />
    <rect x="31" y="18" width="20" height="28" rx="3" fill="#ef4444" transform="rotate(18 41 32)" />
  </g>

  <!-- Schriftzug auf der vordersten Karte -->
  <text
    x="41"
    y="36"
    transform="rotate(18 41 32)"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="13"
    font-weight="bold"
    font-style="italic"
    fill="#ffffff"
  >UNO</text>
</svg>
