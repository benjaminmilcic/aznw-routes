<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img">
  <rect width="480" height="320" rx="18" fill="#eaf2fb"/>

  <!-- Leitung -->
  <path d="M0 196 C120 214 360 214 480 196" fill="none" stroke="#23324d" stroke-width="9" stroke-linecap="round"/>
  <path d="M0 194 C120 212 360 212 480 194" fill="none" stroke="#8d99ab" stroke-width="4" stroke-linecap="round"/>

  <!-- Vogel -->
  <g stroke="#23324d" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M176 200 C168 160 190 130 220 130 C252 130 272 152 272 176 C272 192 262 200 250 202 Z" fill="#2f5d99"/>
    <path d="M196 168 C214 158 240 162 254 176 C240 186 214 184 196 168 Z" fill="#25497a"/>
    <path d="M272 176 l38 -16 l-30 30 Z" fill="#2f5d99"/>
    <circle cx="232" cy="150" r="6.5" fill="#fdf6e8"/>
    <circle cx="233" cy="150" r="2.8" fill="#23324d"/>
    <path d="M258 146 l22 6 l-22 6 Z" fill="#f0b53f"/>
    <!-- Fuesse, beide auf demselben Draht -->
    <path d="M204 200 v6 M212 200 v6" stroke-width="4"/>
    <path d="M228 200 v6 M236 200 v6" stroke-width="4"/>
  </g>

  <!-- gleiche Spannung an beiden Fuessen -->
  <g stroke="#5a9e6f" stroke-width="3.4" stroke-dasharray="7 6">
    <path d="M208 218 V262"/>
    <path d="M232 218 V262"/>
  </g>
  <g stroke="#5a9e6f" stroke-width="4.6" stroke-linecap="round">
    <path d="M208 262 H232"/>
  </g>
  <circle cx="208" cy="262" r="7" fill="#5a9e6f" stroke="#23324d" stroke-width="2.6"/>
  <circle cx="232" cy="262" r="7" fill="#5a9e6f" stroke="#23324d" stroke-width="2.6"/>
  <!-- Null: kein Unterschied, kein Strom -->
  <g stroke="#5a9e6f" stroke-width="4.6" fill="none">
    <ellipse cx="220" cy="292" rx="13" ry="17"/>
  </g>

  <!-- Strom laeuft im Draht weiter, nicht durch den Vogel -->
  <g stroke="#f0b53f" stroke-width="5" stroke-linecap="round">
    <path d="M56 202 H116"/>
    <path d="M330 208 H392"/>
  </g>
  <g fill="#f0b53f">
    <path d="M126 202 l-15 -9 v18 Z"/>
    <path d="M402 208 l-15 -9 v18 Z"/>
  </g>
</svg>
