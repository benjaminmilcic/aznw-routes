<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img">
  <rect width="480" height="320" rx="18" fill="#fdf6e8"/>

  <!-- Chili -->
  <g stroke="#23324d" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78 62 c26 -6 44 8 52 30 c22 44 20 108 -10 148 c-24 32 -60 30 -74 2 c-16 -32 -6 -84 12 -122 c8 -18 12 -46 20 -58 Z" fill="#d9614c"/>
    <path d="M78 62 c-6 -18 -20 -26 -34 -24 c8 16 14 26 22 34 Z" fill="#5a9e6f"/>
    <path d="M96 106 c14 34 16 84 -2 122" fill="none" stroke="#b03f2c" stroke-width="4"/>
  </g>
  <!-- Capsaicin-Molekuele -->
  <g fill="#f0b53f" stroke="#23324d" stroke-width="2.6">
    <circle cx="150" cy="120" r="10"/><circle cx="176" cy="152" r="8"/><circle cx="158" cy="186" r="9"/>
  </g>

  <!-- Rezeptor TRPV1 als Tor in einer Membran -->
  <g stroke="#23324d" stroke-width="3.4" stroke-linejoin="round">
    <rect x="222" y="120" width="150" height="26" rx="8" fill="#c9d2de"/>
    <rect x="222" y="176" width="150" height="26" rx="8" fill="#c9d2de"/>
    <!-- Kanal -->
    <path d="M282 120 v82" stroke-width="7" stroke="#5b6675"/>
    <path d="M320 120 v82" stroke-width="7" stroke="#5b6675"/>
  </g>
  <!-- Capsaicin oeffnet das Tor -->
  <g fill="#f0b53f" stroke="#23324d" stroke-width="2.6">
    <circle cx="252" cy="160" r="11"/>
  </g>
  <path d="M266 160 H278" stroke="#f0b53f" stroke-width="5" stroke-linecap="round"/>
  <!-- Alternative: echte Hitze wuerde dasselbe Tor oeffnen -->
  <g stroke="#d9614c" stroke-width="4.5" stroke-linecap="round" fill="none">
    <path d="M298 96 C306 84 292 74 300 62"/>
    <path d="M312 96 C320 84 306 74 314 62"/>
  </g>

  <!-- Signal laeuft ins Gehirn: Meldung "heiss" -->
  <g stroke="#d9614c" stroke-width="5" stroke-linecap="round">
    <path d="M334 216 C352 246 380 258 404 254"/>
  </g>
  <path d="M414 252 l-16 -8 l-1 16 Z" fill="#d9614c"/>
  <g stroke="#23324d" stroke-width="3.4" stroke-linejoin="round">
    <path d="M404 92 c26 0 46 18 46 42 c0 16 -8 28 -20 34 c-2 14 -14 22 -28 20 c-14 -2 -22 -14 -20 -28 c-12 -6 -18 -18 -16 -32 c2 -22 16 -36 38 -36 Z" fill="#e8b0a4"/>
    <path d="M394 108 c10 8 8 20 0 26 c-8 6 -6 18 4 24" fill="none" stroke-width="3"/>
  </g>
  <!-- Thermometer als Meldung -->
  <g stroke="#23324d" stroke-width="3" stroke-linejoin="round">
    <rect x="428" y="196" width="16" height="58" rx="8" fill="#ffffff"/>
    <circle cx="436" cy="262" r="12" fill="#d9614c"/>
    <rect x="431" y="216" width="10" height="40" rx="5" fill="#d9614c"/>
  </g>
</svg>
