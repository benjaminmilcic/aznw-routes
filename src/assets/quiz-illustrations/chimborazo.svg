<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img">
  <rect width="480" height="320" rx="18" fill="#1c2a44"/>

  <!-- Erde als abgeplattetes Ellipsoid -->
  <g stroke="#23324d" stroke-width="3.6">
    <ellipse cx="240" cy="170" rx="180" ry="140" fill="#2f5d99"/>
  </g>
  <!-- Vergleichskreis: wie eine echte Kugel waere -->
  <circle cx="240" cy="170" r="140" fill="none" stroke="#a8c8e8" stroke-width="2.6" stroke-dasharray="8 8"/>

  <!-- Aequator -->
  <path d="M60 170 H420" stroke="#f0b53f" stroke-width="3" stroke-dasharray="9 7"/>
  <!-- Erdmittelpunkt -->
  <circle cx="240" cy="170" r="6" fill="#fdf6e8"/>

  <!-- Kontinent-Andeutung -->
  <path d="M180 96 c26 -12 52 4 74 -4 c18 -6 32 4 40 14 c-10 34 -44 54 -84 48 c-26 -4 -40 -38 -30 -58 Z" fill="#5a9e6f" opacity=".7"/>

  <!-- Chimborazo am Aequator, weit aussen -->
  <g stroke="#23324d" stroke-width="3" stroke-linejoin="round">
    <path d="M404 170 l20 -34 l20 34 Z" fill="#e6e9ee"/>
  </g>
  <path d="M240 170 H444" stroke="#5a9e6f" stroke-width="4.5"/>
  <circle cx="424" cy="136" r="5.5" fill="#5a9e6f" stroke="#23324d" stroke-width="2.4"/>

  <!-- Everest weiter noerdlich, hoeher aber naeher am Mittelpunkt -->
  <g transform="rotate(-42 240 170)">
    <g stroke="#23324d" stroke-width="3" stroke-linejoin="round">
      <path d="M368 170 l26 -52 l26 52 Z" fill="#e6e9ee"/>
    </g>
    <path d="M240 170 H420" stroke="#d9614c" stroke-width="4.5"/>
    <circle cx="394" cy="118" r="5.5" fill="#d9614c" stroke="#23324d" stroke-width="2.4"/>
  </g>

  <!-- Aequatorwulst hervorheben -->
  <g stroke="#f0b53f" stroke-width="4.5" stroke-linecap="round" fill="none">
    <path d="M380 236 C420 216 430 192 428 172"/>
  </g>
  <path d="M428 172 l-9 14 l16 2 Z" fill="#f0b53f"/>
</svg>
