    <path d="M196 156 C176 118 178 88 196 66 C204 92 206 124 214 148 Z" fill="#c9b192"/>
    <path d="M284 156 C304 118 302 88 284 66 C276 92 274 124 266 148 Z" fill="#c9b192"/>
