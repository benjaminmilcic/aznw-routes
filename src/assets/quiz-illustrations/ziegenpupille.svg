    <path d="M240 306 C204 306 186 266 186 216 C186 176 208 152 240 152 C272 152 294 176 294 216 C294 266 276 306 240 306 Z" fill="#e6ddd0"/>
    <!-- Ohren -->
    <path d="M186 190 C160 178 138 184 128 200 C146 214 170 216 188 208 Z" fill="#d3c7b6"/>
    <path d="M294 190 C320 178 342 184 352 200 C334 214 310 216 292 208 Z" fill="#d3c7b6"/>
    <!-- Schnauze -->
    <path d="M240 300 C224 300 214 288 214 276 C214 264 226 258 240 258 C254 258 266 264 266 276 C266 288 256 300 240 300 Z" fill="#f2ece3"/>
    <path d="M234 272 h-6 M246 272 h6" stroke-width="3"/>
    <!-- Augen mit waagerechtem Rechteckschlitz -->
    <ellipse cx="206" cy="212" rx="21" ry="17" fill="#f7cd77"/>
    <ellipse cx="274" cy="212" rx="21" ry="17" fill="#f7cd77"/>
    <rect x="190" y="205" width="32" height="13" rx="3" fill="#23324d"/>
    <rect x="258" y="205" width="32" height="13" rx="3" fill="#23324d"/>
  </g>

  <!-- Vergleich: waagerechter Schlitz laesst breit Licht herein -->
  <g stroke="#2f5d99" stroke-width="4" stroke-linecap="round">
    <path d="M112 84 L166 198"/>
    <path d="M368 84 L314 198"/>
