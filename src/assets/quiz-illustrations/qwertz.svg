<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img">
  <rect width="480" height="320" rx="18" fill="#fdf6e8"/>

  <!-- Typenhebel, die sich verhaken -->
  <g stroke="#23324d" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Papierwalze -->
    <rect x="150" y="40" width="180" height="34" rx="17" fill="#e6e9ee"/>
    <!-- zwei Hebel, im Anschlag verkeilt -->
    <path d="M126 250 C142 178 190 118 236 84" fill="none" stroke-width="8"/>
    <path d="M354 250 C338 178 290 118 244 84" fill="none" stroke-width="8"/>
    <rect x="222" y="66" width="18" height="22" rx="4" fill="#8d99ab"/>
    <rect x="240" y="66" width="18" height="22" rx="4" fill="#8d99ab"/>
  </g>
  <!-- Kollisionsblitz -->
  <g fill="#d9614c" stroke="#23324d" stroke-width="2.6" stroke-linejoin="round">
    <path d="M240 96 l16 -6 l-6 14 l16 -2 l-24 24 l6 -16 l-14 2 Z"/>
  </g>
  <g stroke="#d9614c" stroke-width="4" stroke-linecap="round">
    <path d="M282 104 l20 -14"/><path d="M292 124 l24 -6"/><path d="M198 104 l-20 -14"/>
  </g>

  <!-- Loesung: haeufige Paare weit auseinander legen -->
  <g stroke="#23324d" stroke-width="3" stroke-linejoin="round">
    <rect x="60" y="252" width="360" height="52" rx="10" fill="#e6e9ee"/>
  </g>
  <g fill="#ffffff" stroke="#8d99ab" stroke-width="2.4">
    <rect x="74" y="264" width="26" height="28" rx="5"/>
    <rect x="106" y="264" width="26" height="28" rx="5"/>
    <rect x="138" y="264" width="26" height="28" rx="5"/>
    <rect x="170" y="264" width="26" height="28" rx="5"/>
    <rect x="202" y="264" width="26" height="28" rx="5"/>
    <rect x="234" y="264" width="26" height="28" rx="5"/>
    <rect x="266" y="264" width="26" height="28" rx="5"/>
    <rect x="298" y="264" width="26" height="28" rx="5"/>
    <rect x="330" y="264" width="26" height="28" rx="5"/>
    <rect x="362" y="264" width="26" height="28" rx="5"/>
  </g>
  <!-- die beiden getrennten Tasten hervorgehoben -->
  <g fill="#f0b53f" stroke="#23324d" stroke-width="3">
    <rect x="106" y="264" width="26" height="28" rx="5"/>
    <rect x="330" y="264" width="26" height="28" rx="5"/>
  </g>
  <path d="M132 238 C186 214 280 214 336 238" fill="none" stroke="#5a9e6f" stroke-width="4.5" stroke-linecap="round"/>
  <g fill="#5a9e6f">
    <path d="M132 238 l14 -9 l2 17 Z"/>
    <path d="M336 238 l-14 -9 l-2 17 Z"/>
  </g>
</svg>
