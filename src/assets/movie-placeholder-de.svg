<svg width="300" height="450" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="filmGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="300" height="450" fill="url(#bgGradient)" rx="8"/>

  <!-- Film Strip Pattern -->
  <g opacity="0.1">
    <rect x="20" y="0" width="40" height="450" fill="white"/>
    <rect x="240" y="0" width="40" height="450" fill="white"/>
    <!-- Perforations -->
    <rect x="25" y="20" width="30" height="15" rx="3" fill="#667eea"/>
    <rect x="25" y="60" width="30" height="15" rx="3" fill="#667eea"/>
    <rect x="25" y="100" width="30" height="15" rx="3" fill="#667eea"/>
    <rect x="25" y="140" width="30" height="15" rx="3" fill="#667eea"/>
    <rect x="25" y="180" width="30" height="15" rx="3" fill="#667eea"/>
    <rect x="25" y="220" width="30" height="15" rx="3" fill="#667eea"/>
    <rect x="25" y="260" width="30" height="15" rx="3" fill="#667eea"/>
    <rect x="25" y="300" width="30" height="15" rx="3" fill="#667eea"/>
    <rect x="25" y="340" width="30" height="15" rx="3" fill="#667eea"/>
    <rect x="25" y="380" width="30" height="15" rx="3" fill="#667eea"/>
    <rect x="25" y="420" width="30" height="15" rx="3" fill="#667eea"/>

    <rect x="245" y="20" width="30" height="15" rx="3" fill="#667eea"/>
    <rect x="245" y="60" width="30" height="15" rx="3" fill="#667eea"/>
    <rect x="245" y="100" width="30" height="15" rx="3" fill="#667eea"/>
    <rect x="245" y="140" width="30" height="15" rx="3" fill="#667eea"/>
    <rect x="245" y="180" width="30" height="15" rx="3" fill="#667eea"/>
    <rect x="245" y="220" width="30" height="15" rx="3" fill="#667eea"/>
    <rect x="245" y="260" width="30" height="15" rx="3" fill="#667eea"/>
    <rect x="245" y="300" width="30" height="15" rx="3" fill="#667eea"/>
    <rect x="245" y="340" width="30" height="15" rx="3" fill="#667eea"/>
    <rect x="245" y="380" width="30" height="15" rx="3" fill="#667eea"/>
    <rect x="245" y="420" width="30" height="15" rx="3" fill="#667eea"/>
  </g>

  <!-- Movie Clapperboard -->
  <g transform="translate(85, 120)">
    <!-- Clapper top (striped) -->
    <rect x="0" y="0" width="130" height="30" fill="#2d3748" rx="4"/>
    <rect x="0" y="0" width="25" height="30" fill="white"/>
    <rect x="30" y="0" width="25" height="30" fill="white"/>
    <rect x="60" y="0" width="25" height="30" fill="white"/>
    <rect x="90" y="0" width="25" height="30" fill="white"/>
    <rect x="120" y="0" width="10" height="30" fill="white"/>

    <!-- Clapper base -->
    <rect x="0" y="30" width="130" height="80" fill="#4a5568" rx="4"/>

    <!-- Hinge circles -->
    <circle cx="15" cy="15" r="5" fill="#e53e3e"/>
    <circle cx="115" cy="15" r="5" fill="#e53e3e"/>
  </g>

  <!-- Popcorn -->
  <g transform="translate(105, 260)">
    <!-- Box -->
    <path d="M 20 40 L 10 80 L 80 80 L 70 40 Z" fill="#e53e3e" stroke="#c53030" stroke-width="2"/>
    <rect x="10" y="75" width="70" height="5" fill="#c53030"/>

    <!-- Stripes on box -->
    <line x1="25" y1="40" x2="20" y2="80" stroke="white" stroke-width="3"/>
    <line x1="45" y1="40" x2="40" y2="80" stroke="white" stroke-width="3"/>
    <line x1="65" y1="40" x2="60" y2="80" stroke="white" stroke-width="3"/>

    <!-- Popcorn pieces -->
    <circle cx="30" cy="30" r="8" fill="#fef3c7"/>
    <circle cx="45" cy="25" r="9" fill="#fef3c7"/>
    <circle cx="60" cy="30" r="8" fill="#fef3c7"/>
    <circle cx="35" cy="18" r="7" fill="#fef3c7"/>
    <circle cx="50" cy="15" r="8" fill="#fef3c7"/>
    <circle cx="55" cy="20" r="7" fill="#fef3c7"/>
    <circle cx="40" cy="10" r="6" fill="#fef3c7"/>
  </g>

  <!-- Text -->
  <text x="150" y="380" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">Kein Bild</text>
  <text x="150" y="405" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.8)" text-anchor="middle">verfügbar</text>
</svg>
