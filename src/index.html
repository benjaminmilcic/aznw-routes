    <style>
      /* Loader Styles - wird sofort beim Laden angezeigt */
      .app-loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: radial-gradient(
          ellipse at top,
          #1e3a8a 0%,
          #000030 60%,
          #000018 100%
        );
        z-index: 9999;
        overflow: hidden;
        transition: opacity 0.5s ease-out;
      }

      .app-loading.loaded {
        opacity: 0;
        pointer-events: none;
      }

      .app-loading::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 20% 30%, rgba(59, 130, 246, 0.18) 0%, transparent 40%),
          radial-gradient(circle at 80% 70%, rgba(147, 51, 234, 0.14) 0%, transparent 40%),
          repeating-linear-gradient(0deg, transparent 0 40px, rgba(255, 255, 255, 0.025) 40px 41px),
          repeating-linear-gradient(90deg, transparent 0 40px, rgba(255, 255, 255, 0.025) 40px 41px);
        pointer-events: none;
      }

      .app-loading::after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse at center bottom,
          transparent 50%,
          rgba(0, 0, 0, 0.4) 100%
        );
        pointer-events: none;
      }

      .spinner {
        width: 60px;
        height: 60px;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top: 4px solid #ffffff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        position: relative;
        z-index: 1;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .loader-text {
        margin-top: 20px;
        color: #ffffff;
        font-family: 'Roboto', sans-serif;
        font-size: 18px;
        font-weight: 300;
        letter-spacing: 1px;
        position: relative;
        z-index: 1;
      }

      .loader-text::after {
        content: '';
        animation: dots 1.5s steps(4, end) infinite;
      }

      @keyframes dots {
        0%, 20% { content: ''; }
        40% { content: '.'; }
        60% { content: '..'; }
        80%, 100% { content: '...'; }
      }
    </style>
  </head>
  <body>
    <div class="app-loading" id="appLoader">
      <div class="spinner"></div>
      <div class="loader-text">Loading</div>
    </div>
    <app-root></app-root>
  </body>
