    <style>
      /* Loader Styles - wird sofort beim Laden angezeigt */
      .app-loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: #000030;
        z-index: 9999;
        overflow: hidden;
        transition: opacity 0.5s ease-out;
      }

      .app-loading.loaded {
        opacity: 0;
        pointer-events: none;
      }

      .app-loading::before {
        content: " ";
        display: block;
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        opacity: 0.4;
        background: linear-gradient(
            135deg,
            rgba(29, 78, 216, 0.85) 0%,
            rgba(37, 99, 235, 0.8) 30%,
            rgba(59, 130, 246, 0.75) 70%,
            rgba(30, 64, 175, 0.8) 100%
          ),
          url(/assets/header_bg.webp);
        background-repeat: no-repeat;
        background-position: 50% 0;
        background-size: cover;
      }

      .app-loading::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        opacity: 0.3;
        background: linear-gradient(
          135deg,
          rgba(59, 130, 246, 0.1),
          rgba(147, 51, 234, 0.1)
        );
        pointer-events: none;
      }

      .spinner {
        width: 60px;
        height: 60px;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top: 4px solid #ffffff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        position: relative;
        z-index: 1;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .loader-text {
        margin-top: 20px;
        color: #ffffff;
        font-family: 'Roboto', sans-serif;
        font-size: 18px;
        font-weight: 300;
        letter-spacing: 1px;
        position: relative;
        z-index: 1;
      }

      .loader-text::after {
        content: '';
        animation: dots 1.5s steps(4, end) infinite;
      }

      @keyframes dots {
        0%, 20% { content: ''; }
        40% { content: '.'; }
        60% { content: '..'; }
        80%, 100% { content: '...'; }
      }
    </style>
  </head>
  <body>
    <div class="app-loading" id="appLoader">
      <div class="spinner"></div>
      <div class="loader-text">Loading</div>
    </div>
    <app-root></app-root>
  </body>
