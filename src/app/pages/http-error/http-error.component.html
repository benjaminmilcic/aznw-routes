<div class="error-dialog">
  <h2 mat-dialog-title class="dialog-title">
    <div class="title-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
        <path
          d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"
        />
      </svg>
    </div>
    <span>{{ "httpError.errorOccurs" | translate }}</span>
  </h2>

  <mat-dialog-content class="dialog-content">
    <div class="h-4"></div>
    <div *ngIf="!data.success" class="error-content">
      <div class="error-icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"
          />
        </svg>
      </div>
      <div class="message-section">
        <p class="main-message">
          {{ "httpError.httpErrorOccurs" | translate }}
        </p>
        <p class="contact-info">
          {{ "httpError.contactMeVia" | translate }}
        </p>
        <div class="email-container">
          <a [href]="'mailto:' + email" class="email-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"
              />
            </svg>
            {{ email }}
          </a>
        </div>
      </div>
    </div>

    <div *ngIf="data.success" class="success-content">
      <div class="success-icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"
          />
        </svg>
      </div>
      <div class="message-section">
        <p class="main-message">
          {{ "httpError.httpErrorOccurs2" | translate }}
        </p>
        <p class="info-message">
          {{ "httpError.emailWasSendToMe" | translate }}
        </p>
        <p class="info-message">
          {{ "httpError.checkInternetConnection" | translate }}
        </p>
      </div>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions class="dialog-actions">
    <button
      mat-raised-button
      color="primary"
      mat-dialog-close
      cdkFocusInitial
      class="action-button"
    >
      Ok
    </button>
  </mat-dialog-actions>
</div>
