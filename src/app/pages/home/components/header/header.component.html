<header id="header">
  <div class="content">
    <div
      class="relative border border-orange-200  bg-gradient-to-br from-orange-100 to-orange-300  p-8 rounded-2xl m-4"
    >
      <!-- Schrauben -->
      <div class="absolute top-3 left-3 w-5 h-5 rounded-full flex items-center justify-center"
           style="background: radial-gradient(circle at 30% 30%, #9ca3af, #4b5563, #1f2937); box-shadow: inset -1px -1px 2px rgba(255,255,255,0.3), inset 2px 2px 3px rgba(0,0,0,0.5), 0 2px 4px rgba(0,0,0,0.3);">
        <div class="w-3 h-0.5 absolute rotate-45" style="background: #374151; box-shadow: inset 0 1px 2px rgba(0,0,0,0.6), inset 0 -1px 1px rgba(255,255,255,0.1);"></div>
        <div class="w-3 h-0.5 absolute -rotate-45" style="background: #374151; box-shadow: inset 0 1px 2px rgba(0,0,0,0.6), inset 0 -1px 1px rgba(255,255,255,0.1);"></div>
      </div>
      <div class="absolute top-3 right-3 w-5 h-5 rounded-full flex items-center justify-center"
           style="background: radial-gradient(circle at 30% 30%, #9ca3af, #4b5563, #1f2937); box-shadow: inset -1px -1px 2px rgba(255,255,255,0.3), inset 2px 2px 3px rgba(0,0,0,0.5), 0 2px 4px rgba(0,0,0,0.3);">
        <div class="w-3 h-0.5 absolute rotate-45" style="background: #374151; box-shadow: inset 0 1px 2px rgba(0,0,0,0.6), inset 0 -1px 1px rgba(255,255,255,0.1);"></div>
        <div class="w-3 h-0.5 absolute -rotate-45" style="background: #374151; box-shadow: inset 0 1px 2px rgba(0,0,0,0.6), inset 0 -1px 1px rgba(255,255,255,0.1);"></div>
      </div>
      <div class="absolute bottom-3 left-3 w-5 h-5 rounded-full flex items-center justify-center"
           style="background: radial-gradient(circle at 30% 30%, #9ca3af, #4b5563, #1f2937); box-shadow: inset -1px -1px 2px rgba(255,255,255,0.3), inset 2px 2px 3px rgba(0,0,0,0.5), 0 2px 4px rgba(0,0,0,0.3);">
        <div class="w-3 h-0.5 absolute rotate-45" style="background: #374151; box-shadow: inset 0 1px 2px rgba(0,0,0,0.6), inset 0 -1px 1px rgba(255,255,255,0.1);"></div>
        <div class="w-3 h-0.5 absolute -rotate-45" style="background: #374151; box-shadow: inset 0 1px 2px rgba(0,0,0,0.6), inset 0 -1px 1px rgba(255,255,255,0.1);"></div>
      </div>
      <div class="absolute bottom-3 right-3 w-5 h-5 rounded-full flex items-center justify-center"
           style="background: radial-gradient(circle at 30% 30%, #9ca3af, #4b5563, #1f2937); box-shadow: inset -1px -1px 2px rgba(255,255,255,0.3), inset 2px 2px 3px rgba(0,0,0,0.5), 0 2px 4px rgba(0,0,0,0.3);">
        <div class="w-3 h-0.5 absolute rotate-45" style="background: #374151; box-shadow: inset 0 1px 2px rgba(0,0,0,0.6), inset 0 -1px 1px rgba(255,255,255,0.1);"></div>
        <div class="w-3 h-0.5 absolute -rotate-45" style="background: #374151; box-shadow: inset 0 1px 2px rgba(0,0,0,0.6), inset 0 -1px 1px rgba(255,255,255,0.1);"></div>
      </div>

      <h1 class="text-sky-900">Benjamin Milčić</h1>
      <h3 class="text-sky-700">
        <em>Full Stack {{ "header.developer" | translate }}</em>
      </h3>
      <div class="mx-4">
        <p class="relaxed-text text-sky-900">
          {{ "header.passionateDeveloper" | translate }}
          <br />
          {{ "header.transform" | translate }}
        </p>
      </div>
    </div>

    <div class="button-wrapper">
      <a [routerLink]="['/']" fragment="about" class="btn-primary"
        ><div class="flex gap-2 items-center">
          <mat-icon fontIcon="person"></mat-icon>
          <div>{{ "header.findOutMore" | translate }}</div>
        </div></a
      >
      <a [routerLink]="['/']" fragment="contact" class="btn-secondary">
        <div class="flex gap-2 items-center">
          <mat-icon fontIcon="mail"></mat-icon>
          <div>{{ "portfolio.contact" | translate }}</div>
        </div>
      </a>
    </div>
  </div>
</header>
