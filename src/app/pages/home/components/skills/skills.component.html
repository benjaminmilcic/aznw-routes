<section id="skills" class="skills-section">
  <div class="skills-inner">
    <div class="section-tag">
      <span class="num">02</span>
      <span>{{ "sidebar.skills" | translate}}</span>
    </div>
    <h2 class="section-h" [innerHTML]="'skills.sectionH' | translate"></h2>

    <!-- ── Large version (≥1024px) ───────────────────── -->
    <div class="skills-large">
      <div
        class="main"
        [matTooltip]="'skills.workplace' | translate"
        matTooltipClass="my-tooltip-class"
      >
        <div class="pulse-ring"></div>

        <div
          class="circle group cursor-pointer animation skill-animation2"
          (click)="openLink('https://wikipedia.org/wiki/HTML5')"
        >
          <div class="circle-image">
            <img src="assets/svg/html5.svg" width="36px" />
          </div>
          <p class="group-hover:font-bold font-semibold mt-[2px]">HTML5</p>
        </div>

        <div
          class="circle group cursor-pointer animation skill-animation3"
          (click)="
            openLink('https://wikipedia.org/wiki/Cascading_Style_Sheets#CSS3')
          "
        >
          <div class="circle-image">
            <img
              src="assets/svg/css3.svg"
              width="36px"
              class="rotate-[-28deg]"
            />
          </div>
          <p
            class="group-hover:font-bold font-semibold ml-[48px] mt-[-4px] rotate-[-28deg]"
          >
            CSS3
          </p>
        </div>

        <div
          class="circle group cursor-pointer animation skill-animation4"
          (click)="openLink('https://wikipedia.org/wiki/JavaScript')"
        >
          <div class="circle-image">
            <img src="assets/svg/js.svg" width="36px" class="rotate-[-55deg]" />
          </div>
          <p
            class="group-hover:font-bold font-semibold ml-[78px] mt-[-22px] rotate-[-55deg]"
          >
            JavaScript
          </p>
        </div>

        <div
          class="circle group cursor-pointer animation skill-animation5"
          (click)="openLink('https://angular.io/')"
        >
          <div class="circle-image">
            <div class="translate-x-[2px]">
              <img
                src="assets/angular_logo.png"
                width="36px"
                class="rotate-[-83deg]"
              />
            </div>
          </div>
          <p
            class="group-hover:font-bold font-semibold ml-[92px] mt-[-42px] rotate-[-83deg]"
          >
            Angular
          </p>
        </div>

        <div
          class="circle group cursor-pointer animation skill-animation6"
          (click)="openLink('https://ionicframework.com/')"
        >
          <div class="circle-image">
            <img
              src="assets/svg/ionic.svg"
              width="36px"
              class="rotate-[-111deg]"
            />
          </div>
          <p
            class="group-hover:font-bold font-semibold rotate-[-111deg] mt-[-64px] ml-[92px]"
          >
            Ionic
          </p>
        </div>

        <div
          class="circle group cursor-pointer animation skill-animation7"
          (click)="openLink('https://www.cypress.io/')"
        >
          <div class="circle-image">
            <img
              src="assets/svg/cypress.svg"
              width="36px"
              class="rotate-[-138deg]"
            />
          </div>
          <p
            class="group-hover:font-bold font-semibold rotate-[-138deg] mt-[-80px] ml-[62px]"
          >
            Cypress
          </p>
        </div>

        <div
          class="circle group cursor-pointer animation skill-animation8"
          (click)="openLink('https://rxjs.dev/')"
        >
          <div class="circle-image">
            <img
              src="assets/svg/rxjs.svg"
              width="36px"
              class="rotate-[-166deg]"
            />
          </div>
          <p
            class="group-hover:font-bold font-semibold rotate-[-166deg] mt-[-90px] ml-[24px]"
          >
            RxJs
          </p>
        </div>

        <div
          class="circle group cursor-pointer animation skill-animation9"
          (click)="openLink('https://tailwindcss.com/')"
        >
          <div class="circle-image">
            <img
              src="assets/svg/tailwind.svg"
              width="36px"
              class="rotate-[-194deg]"
            />
          </div>
          <p
            class="group-hover:font-bold font-semibold rotate-[-194deg] mt-[-90px] ml-[-20px]"
          >
            Tailwind
          </p>
        </div>

        <div
          class="circle group cursor-pointer animation skill-animation10"
          (click)="openLink('https://www.mysql.com')"
        >
          <div class="circle-image">
            <img
              src="assets/svg/mysql.svg"
              width="36px"
              class="rotate-[-222deg]"
            />
          </div>
          <p
            class="group-hover:font-bold font-semibold rotate-[-222deg] mt-[-80px] ml-[-62px]"
          >
            MySQL
          </p>
        </div>

        <div
          class="circle group cursor-pointer animation skill-animation11"
          (click)="openLink('https://nodejs.org')"
        >
          <div class="circle-image">
            <img
              src="assets/svg/nodejs.svg"
              width="48px"
              class="rotate-[-249deg]"
            />
          </div>
          <p
            class="group-hover:font-bold font-semibold rotate-[-249deg] mt-[-60px] ml-[-84px]"
          >
            Node.js
          </p>
        </div>

        <div
          class="circle group cursor-pointer animation skill-animation12"
          (click)="openLink('https://nestjs.com/')"
        >
          <div class="circle-image">
            <img
              src="assets/svg/nestjs.svg"
              class="rotate-[-278deg]"
              width="48px"
            />
          </div>
          <p
            class="group-hover:font-bold font-semibold rotate-[-278deg] mt-[-40px] ml-[-89px]"
          >
            NestJS
          </p>
        </div>

        <div
          class="circle group cursor-pointer animation skill-animation13"
          (click)="openLink('https://www.npmjs.com/')"
        >
          <div class="circle-image">
            <img
              src="assets/svg/npm.svg"
              class="rotate-[-305deg]"
              width="48px"
            />
          </div>
          <p
            class="group-hover:font-bold font-semibold rotate-[-305deg] mt-[-20px] ml-[-72px]"
          >
            npm
          </p>
        </div>

        <div
          class="circle group cursor-pointer animation skill-animation14"
          (click)="openLink('https://ngrx.io/')"
        >
          <div class="circle-image">
            <img
              src="assets/svg/ngrx.svg"
              width="36px"
              class="rotate-[-332deg]"
            />
          </div>
          <p
            class="group-hover:font-bold font-semibold rotate-[-332deg] ml-[-40px] mt-[-4px]"
          >
            NgRx
          </p>
        </div>
      </div>
    </div>

    <!-- ── Small version (<1024px) ───────────────────── -->
    <div class="skills-small">
      <div class="photo-wrap">
        <img
          src="/assets/workplacehome.webp"
          class="workplace-photo touch-auto"
        />
      </div>
      <div class="skill-grid">
        <div
          class="skill-card"
          (click)="openLink('https://wikipedia.org/wiki/HTML5')"
        >
          <img src="assets/svg/html5.svg" /><span>HTML5</span>
        </div>
        <div
          class="skill-card"
          (click)="
            openLink('https://wikipedia.org/wiki/Cascading_Style_Sheets#CSS3')
          "
        >
          <img src="assets/svg/css3.svg" /><span>CSS3</span>
        </div>
        <div
          class="skill-card"
          (click)="openLink('https://wikipedia.org/wiki/JavaScript')"
        >
          <img src="assets/svg/js.svg" /><span>JavaScript</span>
        </div>
        <div class="skill-card" (click)="openLink('https://angular.io/')">
          <img src="assets/angular_logo.png" /><span>Angular</span>
        </div>
        <div
          class="skill-card"
          (click)="openLink('https://ionicframework.com/')"
        >
          <img src="assets/svg/ionic.svg" /><span>Ionic</span>
        </div>
        <div class="skill-card" (click)="openLink('https://www.cypress.io/')">
          <img src="assets/svg/cypress.svg" /><span>Cypress</span>
        </div>
        <div class="skill-card" (click)="openLink('https://rxjs.dev/')">
          <img src="assets/svg/rxjs.svg" /><span>RxJs</span>
        </div>
        <div class="skill-card" (click)="openLink('https://tailwindcss.com/')">
          <img src="assets/svg/tailwind.svg" /><span>Tailwind</span>
        </div>
        <div
          class="skill-card"
          (click)="openLink('https://firebase.google.com/')"
        >
          <img src="assets/svg/firebase.svg" /><span>Firebase</span>
        </div>
        <div class="skill-card" (click)="openLink('https://www.mysql.com')">
          <img src="assets/svg/mysql.svg" /><span>MySQL</span>
        </div>
        <div class="skill-card" (click)="openLink('https://nodejs.org')">
          <img src="assets/svg/nodejs.svg" /><span>Node.js</span>
        </div>
        <div class="skill-card" (click)="openLink('https://nestjs.com/')">
          <img src="assets/svg/nestjs.svg" /><span>NestJS</span>
        </div>
        <div class="skill-card" (click)="openLink('https://www.npmjs.com/')">
          <img src="assets/svg/npm.svg" /><span>npm</span>
        </div>
        <div class="skill-card" (click)="openLink('https://ngrx.io/')">
          <img src="assets/svg/ngrx.svg" /><span>NgRx</span>
        </div>
      </div>
    </div>

    <!-- ── CTA ───────────────────────────────────────── -->
    <div class="skills-cta">
      <a class="btn-pill" [routerLink]="['/']" fragment="portfolio">
        <i class="fa-solid fa-briefcase"></i>
        {{ "skills.viewPortfolio" | translate }}
        <i class="fa-solid fa-arrow-right fa-xs"></i>
      </a>
    </div>
  </div>
</section>
