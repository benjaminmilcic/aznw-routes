<section id="skills" class="skills-section">
  <div class="skills-inner">
    <div class="section-tag">
      <span class="num">02</span>
      <span>{{ "sidebar.skills" | translate}}</span>
    </div>
    <h2 class="section-h" [innerHTML]="'skills.sectionH' | translate"></h2>

    <!-- ── Large version (≥1024px) ───────────────────── -->
    <div class="skills-large">
      <div class="main">
        <div class="pulse-ring"></div>

        <!-- Position and fly-in come from --angle/--start (skills.component.ts), the label stays upright below the icon -->
        @for (skill of orbit; track skill.name) {
          <div
            class="circle group cursor-pointer animation"
            [style.--angle]="skill.angle + 'deg'"
            [style.--start]="skill.start + 'deg'"
            (click)="openLink(skill.url)"
          >
            <div class="circle-image">
              <img alt="" [src]="skill.icon" [width]="skill.size" />
            </div>
            <p class="group-hover:font-bold font-semibold mb-0 mt-[2px]">{{ skill.name }}</p>
          </div>
        }

        <!-- Center hover-zone: only this covers the photo disc, so the tooltip
             fires over the image but not over the orbiting skill icons. -->
        <div class="main-center" [matTooltip]="'skills.workplace' | translate" matTooltipClass="my-tooltip-class"></div>
      </div>
    </div>

    <!-- ── Small version (<1024px) ───────────────────── -->
    <div class="skills-small">
      <div class="photo-wrap">
        <img alt="" src="/assets/workplacehome.webp" class="workplace-photo touch-auto" />
      </div>
      <div class="skill-grid">
        <div class="skill-card" (click)="openLink('https://wikipedia.org/wiki/HTML5')">
          <img alt="" src="assets/svg/html5.svg" /><span>HTML5</span>
        </div>
        <div class="skill-card" (click)="
            openLink('https://wikipedia.org/wiki/Cascading_Style_Sheets#CSS3')
          ">
          <img alt="" src="assets/svg/css3.svg" /><span>CSS3</span>
        </div>
        <div class="skill-card" (click)="openLink('https://tailwindcss.com/')">
          <img alt="" src="assets/svg/tailwind.svg" /><span>Tailwind</span>
        </div>
        <div class="skill-card" (click)="openLink('https://wikipedia.org/wiki/JavaScript')">
          <img alt="" src="assets/svg/js.svg" /><span>JavaScript</span>
        </div>
        <div class="skill-card" (click)="openLink('https://angular.io/')">
          <img alt="" src="assets/angular_logo.png" /><span>Angular</span>
        </div>
        <div class="skill-card" (click)="openLink('https://rxjs.dev/')">
          <img alt="" src="assets/svg/rxjs.svg" /><span>RxJs</span>
        </div>
        <div class="skill-card" (click)="openLink('https://ngrx.io/')">
          <img alt="" src="assets/svg/ngrx.svg" /><span>NgRx</span>
        </div>
        <div class="skill-card" (click)="openLink('https://nodejs.org')">
          <img alt="" src="assets/svg/nodejs.svg" /><span>Node.js</span>
        </div>
        <div class="skill-card" (click)="openLink('https://nestjs.com/')">
          <img alt="" src="assets/svg/nestjs.svg" /><span>NestJS</span>
        </div>
        <div class="skill-card" (click)="openLink('https://www.litellm.ai/')">
          <img alt="" src="assets/litellm_logo.png" /><span>LiteLLM</span>
        </div>
        <div class="skill-card" (click)="openLink('https://ionicframework.com/')">
          <img alt="" src="assets/svg/ionic.svg" /><span>Ionic</span>
        </div>
        <div class="skill-card" (click)="openLink('https://capacitorjs.com/')">
          <img alt="" src="assets/svg/capacitor.svg" /><span>Capacitor</span>
        </div>

        <div class="skill-card" (click)="openLink('https://www.mysql.com')">
          <img alt="" src="assets/svg/mysql.svg" /><span>MySQL</span>
        </div>

        <div class="skill-card" (click)="openLink('https://firebase.google.com/')">
          <img alt="" src="assets/svg/firebase.svg" /><span>Firebase</span>
        </div>
        <div class="skill-card" (click)="openLink('https://www.cypress.io/')">
          <img alt="" src="assets/svg/cypress.svg" /><span>Cypress</span>
        </div>
      </div>
    </div>

    <!-- ── CTA ───────────────────────────────────────── -->
    <div class="skills-cta">
      <a class="btn-pill" [routerLink]="['/']" fragment="portfolio">
        <i class="fa-solid fa-briefcase"></i>
        {{ "skills.viewPortfolio" | translate }}
        <i class="fa-solid fa-arrow-right fa-xs"></i>
      </a>
    </div>
  </div>
</section>
