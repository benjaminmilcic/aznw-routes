<section id="contact">
  <div class="content">
    <div class="text-[#1d4ed8] font-bold text-3xl sm:text-5xl">
      {{ "contact.headline" | translate }}
    </div>
    <p class="pt-[10px] font-bold text-[#64748b]">
      {{ "contact.text1" | translate }}
      <br />
      {{ "contact.text2" | translate }}
    </p>
    <div class="contact-wrapper">
      <div
        class="bg-white bg-opacity-40 flex w-full gap-4 rounded-lg shadow-lg hover:shadow-xl hover:translate-y-[-4px] cursor-pointer items-center contact-box"
         (click)="callNumber()"
      >
        <div class="info-icon"><i class="fa-solid fa-phone"></i></div>
        <div class="flex flex-col justify-around items-start h-full">
          <div class="text-black sm:text-xl">{{ "contact.phone" | translate }}</div>
          <div class="text-[#64748b] sm:text-lg">+49 176 41942532</div>
        </div>
      </div>
      <div
        class="bg-white bg-opacity-40 flex w-full gap-4 rounded-lg shadow-lg hover:shadow-xl hover:translate-y-[-4px] cursor-pointer items-center contact-box"
        (click)="openEmail()"
      >
        <div class="info-icon"><i class="fa-solid fa-envelope"></i></div>
        <div class="flex flex-col justify-around items-start h-full">
          <div class="text-black sm:text-xl">Email</div>
          <div class="text-[#64748b] sm:text-lg underline">benjamin.milcic&#64;gmail.com</div>
        </div>
      </div>
    </div>
    <div class="flex justify-center">
      <div class="flex mr-[12px]">
        <form (ngSubmit)="onSubmit(form)" #form="ngForm" class="mt-6">
          <div class="name">
            <div class="firstname">
              <label for="firstname">{{
                "contact.firstName" | translate
              }}</label>
              <input
                type="text"
                name="firstname"
                id="firstname"
                ngModel
                required
              />
            </div>
            <div class="lastname">
              <label for="lastname">{{ "contact.lastName" | translate }}</label>
              <input
                type="text"
                name="lastname"
                id="lastname"
                ngModel
                required
              />
            </div>
          </div>
          <div class="email">
            <label for="email">eMail</label>
            <input
              type="email"
              name="email"
              id="email"
              ngModel
              required
              email
            />
          </div>
          <div class="message">
            <label for="message">{{ "contact.message" | translate }}</label>
            <textarea
              name="message"
              id="message"
              cols="30"
              rows="10"
              ngModel
              required
            ></textarea>
          </div>
          <div class="send-button">
            <button
              [disabled]="!form.valid || isSending"
              type="submit"
              class="submit-btn"
            >
              @if (isSending) {<span class="mr-2"
                ><i class="fa-solid fa-spinner fa-spin"></i></span
              >}@else {<span class="mr-2"
                ><i class="fa-solid fa-paper-plane"></i></span
              >}

              {{ sendButtonText }}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
