<section id="contact" class="contact-section">
  <div class="contact-inner">
    <div class="section-tag">
      <span class="num">04</span>
      <span>Kontakt</span>
    </div>
    <h2 class="section-h" [innerHTML]="'contact.sectionH' | translate"></h2>
    <p class="contact-sub">{{ "contact.contactSub" | translate }}</p>

    <div class="contact-grid">
      <button type="button" class="contact-card" (click)="copyToClipboard('+4917641942532', 'phone')">
        <span class="ico"><i class="fa-solid fa-phone"></i></span>
        <div>
          <div class="ck">{{ "contact.phone" | translate }}</div>
          <div class="cv">+49 176 41942532</div>
        </div>
        @if (copiedKey === 'phone') {
          <div class="copied-popup">{{ "contact.copied" | translate }}</div>
        }
      </button>
      <button type="button" class="contact-card" (click)="copyToClipboard('benjamin.milcic@gmail.com', 'email')">
        <span class="ico"><i class="fa-solid fa-envelope"></i></span>
        <div>
          <div class="ck">Email</div>
          <div class="cv">benjamin.milcic&#64;gmail.com</div>
        </div>
        @if (copiedKey === 'email') {
          <div class="copied-popup">{{ "contact.copied" | translate }}</div>
        }
      </button>
    </div>

    <form class="form-card" (ngSubmit)="onSubmit(form)" #form="ngForm">
      <div class="form-row">
        <div class="field">
          <label for="name">{{ "contact.name" | translate }}</label>
          <input
            type="text"
            name="name"
            id="name"
            ngModel
            required
            [placeholder]="'contact.namePlaceholder' | translate"
          />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input
            type="email"
            name="email"
            id="email"
            ngModel
            required
            email
            [placeholder]="'contact.emailPlaceholder' | translate"
          />
        </div>
      </div>

      <div class="field field-full">
        <label for="message">{{ "contact.message" | translate }}</label>
        <textarea
          name="message"
          id="message"
          ngModel
          required
          [placeholder]="'contact.messagePlaceholder' | translate"
        ></textarea>
      </div>

      <button
        [disabled]="!form.valid || isSending"
        type="submit"
        class="send-btn"
      >
        @if (isSending) {
          <span>
            <i class="fa-solid fa-spinner fa-spin"></i>
          </span>
        } @else {
          <span>
            <i class="fa-solid fa-paper-plane"></i>
          </span>
        }
        {{ sendButtonText }}
      </button>
    </form>
  </div>
</section>
