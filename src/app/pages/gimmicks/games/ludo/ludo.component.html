<!-- Verbindungs-/Fehlerhinweis – gilt für Start- und Spielansicht. -->
<app-sync-status
  [offline]="svc.offline()"
  [error]="svc.error()"
  [pending]="svc.pending()"
  [away]="svc.absent()"
  [blocking]="svc.blockingAbsent()"
  (skipped)="svc.skipAbsent($event)"
  (retried)="svc.resync()"
  (dismissed)="svc.dismissError()"
/>

@if (game()) {
<app-ludo-board />
} @else {
<app-ludo-home />
}
