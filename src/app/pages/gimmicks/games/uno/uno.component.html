<!-- Connection/error notice – applies to the start and game view. -->
<app-sync-status
  [offline]="svc.offline()"
  [error]="svc.error()"
  [pending]="svc.pending()"
  [away]="svc.absent()"
  [blocking]="svc.blockingAbsent()"
  (skipped)="svc.skipAbsent($event)"
  (retried)="svc.resync()"
  (dismissed)="svc.dismissError()"
/>

@if (game()) {
<app-uno-board />
} @else {
<app-uno-home />
}
