<!-- Connection/error notice – applies to the start and game view. -->
<app-sync-status
  [offline]="svc.offline()"
  [error]="svc.error()"
  [pending]="svc.pending()"
  [away]="svc.absent()"
  (retried)="svc.resync()"
  (dismissed)="svc.dismissError()"
/>

@if (game()) {
<app-backgammon-board />
} @else {
<app-backgammon-home />
}
