<div class="mt-8 w-full flex flex-col items-center">
  @for (recipe of recipes|async; track recipe.id) {
  <div
    class="border rounded p-4 mt-4 flex gap-4 justify-between items-center cursor-pointer w-full max-w-[500px] box-border"
    data-cy="recipe-item"
    (click)="goToRecipe(recipe.id)"
  >
    <div class="flex gap-4 items-center">
      @if (recipe.imagePath) {
        <img
          [src]="recipe.imagePath"
          [alt]="recipe.title"
          class="w-[50px] h-auto"
        />
      } @else {
        <div class="w-[50px] h-[50px] min-w-[50px] min-h-[50px] flex items-center justify-center bg-gray-100 rounded border border-gray-300">
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/>
            <circle cx="12" cy="13" r="3"/>
            <line x1="2" y1="2" x2="22" y2="22" stroke-width="2.2"/>
          </svg>
        </div>
      }
      <div class="underline">{{ recipe.title }}</div>
    </div>
    <button
      mat-icon-button
      [matTooltip]="'gimmicks.recipes.deleteRecipe' | translate"
      data-cy="recipe-delete"
      (click)="onDeleteRecipe(recipe.id, recipe.title, $event)"
    >
      <div class="flex justify-center items-center translate-y-[-5px]">🗑️</div>
    </button>
  </div>
  }
</div>
