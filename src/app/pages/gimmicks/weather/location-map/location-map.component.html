<div class="px-4">
  <div class="map-container">
    <div id="map" class="map"></div>

    <!-- Legend -->
    <div class="legend">
      <div class="legend-item" *ngFor="let item of legendData">
        <div class="legend-color" [style.background-color]="item.color"></div>
        <span class="legend-label">{{ item.label }}</span>
      </div>
    </div>
  </div>

  <!-- Weather layer controls -->
  <div class="flex flex-wrap gap-2 mt-3 mb-4 justify-center">
    <button
      (click)="switchLayer('temperature')"
      [class.active]="activeLayer === 'temperature'"
      class="weather-btn"
      [title]="'gimmicks.weather.temperature' | translate"
    >
      <span class="icon">🌡️</span>
      <span class="text">{{ 'gimmicks.weather.temperature' | translate }}</span>
    </button>

    <button
      (click)="switchLayer('wind')"
      [class.active]="activeLayer === 'wind'"
      class="weather-btn"
      [title]="'gimmicks.weather.wind' | translate"
    >
      <span class="icon">💨</span>
      <span class="text">{{ 'gimmicks.weather.wind' | translate }}</span>
    </button>

    <button
      (click)="switchLayer('precipitation')"
      [class.active]="activeLayer === 'precipitation'"
      class="weather-btn"
      [title]="'gimmicks.weather.precipitation' | translate"
    >
      <span class="icon">🌧️</span>
      <span class="text">{{ 'gimmicks.weather.precipitation' | translate }}</span>
    </button>

    <button
      (click)="switchLayer('pressure')"
      [class.active]="activeLayer === 'pressure'"
      class="weather-btn"
      [title]="'gimmicks.weather.pressure' | translate"
    >
      <span class="icon">📊</span>
      <span class="text">{{ 'gimmicks.weather.pressure' | translate }}</span>
    </button>

    <button
      (click)="toggleGlobeProjection()"
      [class.active]="isGlobeProjection"
      class="weather-btn"
      [title]="'gimmicks.weather.globeProjection' | translate"
    >
      <span class="icon">🌍</span>
      <span class="text">{{ 'gimmicks.weather.globeProjection' | translate }}</span>
    </button>
  </div>
</div>
