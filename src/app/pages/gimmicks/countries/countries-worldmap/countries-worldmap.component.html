<main class="container mx-auto px-4 py-6 box-border">
      <div class="relative bg-white/5 backdrop-blur-sm rounded-xl border border-white/10 p-2 shadow-2xl"
           style="height: calc(100vh - 140px);">
        <div id="map" class="w-full h-full rounded-lg shadow-lg"></div>
        @if (countryService.loading()) {
          <div class="absolute inset-0 bg-slate-900/70 flex items-center justify-center rounded-lg z-[1000]">
            <div class="flex flex-col items-center gap-3">
              <mat-spinner diameter="48"></mat-spinner>
              <span class="text-white text-sm">{{'gimmicks.countries.loadingCountriesData'|translate}}</span>
            </div>
          </div>
        }
      </div>
    </main>
