<mat-card data-cy="movie-card" class="w-[140px] h-[311px] md:w-[200px] md:h-[445px] min-h-fit !bg-gray-300 cursor-pointer hover:-translate-y-2"  (click)="onCardClick()">
  <div class="relative w-[140px] h-[210px] md:w-[200px] md:h-[300px]">
    @if (!imageLoaded()) {
      <div class="absolute inset-0 flex items-center justify-center bg-gray-400">
        <mat-spinner [diameter]="32"></mat-spinner>
      </div>
    }
    <img
      mat-card-image
      [src]="posterUrl"
      loading="lazy"
      class="w-[140px] h-[210px] md:w-[200px] md:h-[300px]"
      [class.invisible]="!imageLoaded()"
      (load)="imageLoaded.set(true)"
    />
  </div>
  <div class="rating-overlay top-2 right-[2px] md:right-2 scale-75 md:scale-100 object-right-top">
    <app-movies-rating-display [rating]="media().vote_average" />
  </div>
  <mat-card-content class="!px-1 md:!px-4 !pt-[6px] md:!pt-4 !pb-0">
    <h4 data-cy="movie-card-title" class="text-[14px] md:text-base m-0 mb-1 md:mb-2 leading-tight">{{ media().title || ('gimmicks.movies.unknown' | translate) }}</h4>
    @if (this.media().release_date) {
    <p class="text-[12px] md:text-sm m-0 leading-tight">{{ this.media().release_date | date : "yyyy" }}</p>
    }
  </mat-card-content>
</mat-card>
