<!-- Same night background as the privacy page; the space for the fixed 70px navbar comes from the top padding -->
<section
  id="header"
  class="box-border min-h-dvh bg-[radial-gradient(ellipse_at_top,#1e3a8a_0%,#000030_60%,#000018_100%)] px-5 pb-[clamp(56px,8vw,100px)] pt-[calc(70px+clamp(32px,6vw,72px))] font-['Inter',sans-serif] text-slate-200"
  data-cy="imprint"
>
  <article class="mx-auto max-w-[760px]">
    <a [routerLink]="['/']" class="mb-7 inline-flex items-center gap-2 text-[0.95rem] text-blue-300 no-underline hover:underline">
      <i class="fa-solid fa-arrow-left"></i>
      {{ "imprint.backHome" | translate }}
    </a>

    <h1 class="m-0 mb-6 font-['Fraunces',serif] text-[clamp(1.9rem,5vw,2.8rem)] font-semibold leading-[1.15] text-white">
      {{ "imprint.title" | translate }}
    </h1>

    <p class="m-0 mb-3 leading-[1.7]">{{ "imprint.intro" | translate }}</p>
    <p class="m-0 mb-3 rounded-r-lg border-0 border-l-[3px] border-solid border-blue-400 bg-blue-900/25 px-[18px] py-3.5 leading-[1.7]">
      Benjamin Milčić<br />
      <a [href]="'mailto:' + email" class="text-blue-300">{{ email }}</a>
    </p>
    <p class="m-0 mb-3 leading-[1.7]">
      {{ "imprint.contactText" | translate }}
      <a [routerLink]="['/']" fragment="contact" class="text-blue-300" data-cy="imprint-contact">{{
        "imprint.contactLink" | translate
      }}</a>.
    </p>

    <a [routerLink]="['/']" class="mt-10 inline-flex items-center gap-2 text-[0.95rem] text-blue-300 no-underline hover:underline">
      <i class="fa-solid fa-arrow-left"></i>
      {{ "imprint.backHome" | translate }}
    </a>
  </article>
</section>
